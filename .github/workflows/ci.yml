name: CI

on:
  push:
    branches: [master]
  # No `branches:` filter, deliberately: a filter means "PRs whose BASE is master", so a PR
  # stacked on another branch would get no CI at all and read as silently green.
  pull_request:
  # A merge made with GITHUB_TOKEN (the Dependabot auto-merge) fires no `push` workflows,
  # so dependabot-auto-merge.yml starts a master run through this trigger.
  workflow_dispatch:
  # deploy.yml runs this same gate on a release tag before it builds and pushes the image. On a tag the
  # event is `push`, so the full build runs and the PR-only diff-cover step is skipped.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are superseded by a newer push. A master run must finish: cancelling one
  # would leave a merged commit unverified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ── Docs-only detection ──────────────────────────────────────────────────────
  # A docs or changelog change cannot break a test, so running the build to prove nothing
  # wastes minutes. `paths-ignore` on the trigger is a trap: a workflow filtered out by path
  # never reports its checks, and a required check that never reports blocks the PR forever.
  # So the jobs always run and always report; only the expensive STEPS are skipped.
  #
  # Fail-safe: every ambiguous case (not a PR, empty diff, any non-doc path, any error) yields
  # docs_only=false and the full build runs.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        name: Classify the diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is $EVENT_NAME, not pull_request: running the full build."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --no-renames lists a rename as a delete plus an add. With rename detection a file
          # moved from src/ into docs/ shows only its new docs/ path and hides the deleted code.
          CHANGED=$(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" || true)

          if [ -z "$CHANGED" ]; then
            echo "Empty diff: running the full build rather than guessing."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "$CHANGED" | sed 's/^/  /'

          # Documentation is *.md anywhere or anything under docs/. Everything else is code,
          # including .github/workflows/**, changelog.d/ entries other than *.md, and everything under
          # frontend/ (the React app: even a stray .md there counts as code, so the build and the
          # frontend job always see frontend/ changes).
          NON_DOC=$(echo "$CHANGED" | grep -vE '(^docs/|\.md$)' || true)
          FRONTEND=$(echo "$CHANGED" | grep -E '^frontend/' || true)
          NON_DOC=$(printf '%s\n%s' "$NON_DOC" "$FRONTEND" | sed '/^$/d')

          if [ -z "$NON_DOC" ]; then
            echo "Documentation only: skipping the build."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "Non-documentation paths present:"
            printf '%s\n' "$NON_DOC" | sed 's/^/  /'
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build, Test & Coverage ───────────────────────────────────────────────────
  # `clean verify` runs checkstyle (validate), unit and integration tests, the JaCoCo per-class
  # and bundle rules, and SpotBugs + Find Security Bugs. There is no separate integration job:
  # verify already runs those tests.
  # This job name is a stable check name: dependabot-auto-merge.yml matches it.
  build:
    needs: changes
    name: Build, Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          # diff-cover needs the base branch's history to compute the PR diff.
          fetch-depth: 0

      # The release and deploy scripts run as root-adjacent automation on the production host, so they
      # are linted and their fixture tests run on every change, in seconds, before the slow build.
      # -o check-unassigned-uppercase catches a variable that is used but was deleted or never set, which a
      # script ending in `|| echo unknown` would otherwise swallow silently.
      - name: ShellCheck release.sh and scripts/
        if: needs.changes.outputs.docs_only != 'true'
        run: shellcheck -o check-unassigned-uppercase release.sh scripts/*.sh scripts/tests/*.sh

      - name: Script fixture tests
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          for t in scripts/tests/*-test.sh; do
            echo "==> $t"
            "$t"
          done

      - name: Set up JDK 25
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build, test and verify
        if: needs.changes.outputs.docs_only != 'true'
        run: ./mvnw clean verify --batch-mode --no-transfer-progress

      # The image must not carry application.properties (the Hue key and admin password) or .env. A clean
      # checkout never has them, so the script writes a dummy file with a marker first, builds the image,
      # and fails if the marker is anywhere in it. Proving nothing leaks from a tree that has nothing to
      # leak would prove nothing.
      - name: Docker build test (no secrets in the image)
        if: needs.changes.outputs.docs_only != 'true'
        run: scripts/docker-build-test.sh

      # Changed-lines coverage: at least 90% of the lines a PR adds or changes under
      # src/main/java must be covered. The per-class floors cannot see a PR that adds untested
      # code to an already-high class. diff-cover reads the JaCoCo XML, whose sourcefile paths
      # are package-relative (gregochr/.../Foo.java), so --src-roots maps them onto
      # src/main/java. Pull requests only: a push to master has no PR diff.
      - name: Set up Python (diff-cover)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Changed-lines coverage (diff-cover, 90%)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          pip install diff-cover==10.0.0
          git fetch --no-tags origin "$BASE_REF"
          set +e
          diff-cover target/site/jacoco/jacoco.xml \
            --src-roots src/main/java \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=90 \
            --format "markdown:$RUNNER_TEMP/diff-cover.md" 2>&1 | tee "$RUNNER_TEMP/diff-cover.txt"
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "### Changed-lines coverage (minimum 90%)"
            cat "$RUNNER_TEMP/diff-cover.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

          # A wrong path mapping reports "No lines with coverage information" and passes
          # silently. If the diff touches production code that report is a failure, not a pass.
          TOUCHED_MAIN=$(git diff --no-renames --name-only "origin/$BASE_REF"...HEAD -- src/main/java || true)
          if [ -n "$TOUCHED_MAIN" ] \
              && grep -qs "No lines with coverage information" "$RUNNER_TEMP/diff-cover.txt" "$RUNNER_TEMP/diff-cover.md"; then
            echo "::error::diff-cover found no coverage information although src/main/java changed. Check --src-roots against the JaCoCo report paths."
            exit 1
          fi
          exit "$STATUS"

      # Produced by the forked spotbugs:spotbugs run inside the verify-phase check goal. There
      # is deliberately no separate FindSecBugs step: the plugin sits in the plugin-level
      # configuration, so `verify` already runs it.
      - name: Upload SpotBugs report
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: warn

      - name: Upload JaCoCo coverage report
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Documentation-only change, build skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Every changed path is documentation (*.md or docs/**)."

  # ── Frontend: lint, test, coverage ───────────────────────────────────────────
  # The React app in frontend/. The Java job above also builds it (frontend-maven-plugin runs
  # npm ci + npm run build at generate-resources), so a broken build fails there; this job is the
  # fast feedback on lint, unit tests, coverage and the dependency audit.
  frontend:
    needs: changes
    name: Frontend, Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          # diff-cover needs the base branch's history to compute the PR diff.
          fetch-depth: 0

      - name: Set up Node 22
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm ci

      - name: Lint (0 warnings)
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm run lint

      - name: Unit tests and coverage floor (Vitest, 90% lines / 85% branches)
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm run test:coverage

      # Changed-lines coverage: at least 90% of the lines a PR adds or changes under frontend/src
      # must be covered. diff-cover reads coverage/lcov.info and ignores diff lines in files absent
      # from it (tests, src/test/**, src/main.jsx), so a PR touching no covered source reports "No
      # lines with coverage information" and passes.
      # lcov `SF:` paths are relative to frontend/ but diff-cover resolves them against the repo
      # root: run from frontend/ it silently matches nothing and passes. So the step prefixes `SF:`
      # with `frontend/` and runs from the repo root.
      - name: Set up Python (diff-cover)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Changed-lines coverage (diff-cover, 90%)
        if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          pip install diff-cover==10.0.0
          git fetch --no-tags origin "$BASE_REF"
          sed 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info > "$RUNNER_TEMP/lcov-root.info"
          set +e
          diff-cover "$RUNNER_TEMP/lcov-root.info" \
            --compare-branch="origin/$BASE_REF" \
            --fail-under=90 \
            --format "markdown:$RUNNER_TEMP/diff-cover.md"
          STATUS=$?
          set -e
          {
            echo "### Changed-lines coverage (frontend, minimum 90%)"
            cat "$RUNNER_TEMP/diff-cover.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Dependency audit (npm, high)
        if: needs.changes.outputs.docs_only != 'true'
        run: cd frontend && npm audit --audit-level=high

      - name: Documentation-only change, frontend checks skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Every changed path is documentation (*.md or docs/**)."
