name: PIT Mutation Testing

# Weekly mutation testing of gregochr.commands, services and controllers (pom.xml, pitest plugin,
# threshold 70). It is no longer a PR check: a single run is ~3 minutes locally but adds nothing
# a PR author can act on quickly, so it runs on a schedule and on demand instead.
# One job, not sharded: the codebase is small.

on:
  schedule:
    - cron: '0 6 * * MON'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pitest
  cancel-in-progress: false

jobs:
  pitest:
    name: PIT mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run PIT mutation testing
        id: pitest
        run: |
          set -o pipefail
          ./mvnw test-compile pitest:mutationCoverage --batch-mode --no-transfer-progress 2>&1 | tee pitest-output.log
          MUTATIONS=$(grep -oE 'Generated [0-9]+ mutations Killed [0-9]+ \([0-9]+%\)' pitest-output.log | tail -1 || true)
          STRENGTH=$(grep -oE 'Test strength [0-9]+%' pitest-output.log | tail -1 || true)
          echo "summary=${MUTATIONS:-No summary found}, ${STRENGTH:-test strength n/a}" >> "$GITHUB_OUTPUT"

      - name: Write the score to the summary
        if: always() && steps.pitest.outputs.summary != ''
        env:
          SUMMARY: ${{ steps.pitest.outputs.summary }}
        run: |
          {
            echo "### PIT mutation testing"
            echo
            echo "$SUMMARY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: target/pit-reports/
          if-no-files-found: ignore

  notify-failure:
    needs: pitest
    # A timed-out job ends as `cancelled`, not `failure`, so notify on either.
    if: ${{ always() && (needs.pitest.result == 'failure' || needs.pitest.result == 'cancelled') }}
    permissions:
      issues: write
    uses: ./.github/workflows/ci-failure-issue.yml
    with:
      workflow-name: PIT Mutation Testing
