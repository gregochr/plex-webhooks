# Framework configuration that is the same everywhere and holds no secrets.
#
# Kept apart from application.properties on purpose: application.properties is git-ignored (it carries the
# Hue key and the admin password), so it never reaches the Docker image, and PropertiesRepository reads only
# that file, so nothing here ever appears on the dashboard or in /api/config.
spring:
  application:
    name: cinelight
  autoconfigure:
    # The database is optional: with no spring.datasource.url there must be no DataSource at all, and with one,
    # PlaybackDatabaseConfig builds the pool in code (a pool that never fails startup, with a 3 s connection
    # timeout). This is Spring Boot 4's exact class name; an exclude naming a class that is not on the classpath is
    # ignored silently, so NoDatabaseConfiguredTest asserts the effect.
    exclude: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        # Health and nothing else. SecurityConfig also denies every other /actuator path.
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      group:
        # What Docker's HEALTHCHECK and prod-health.sh read. `ping` only, so a Hue, DIRIGERA or third-party
        # outage can never mark the container unhealthy and have Docker restart it.
        container:
          include: ping
