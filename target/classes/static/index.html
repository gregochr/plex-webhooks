<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex Webhooks Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1f1f1f;
            color: #eaeaea;
            margin: 0;
            padding: 24px 32px;
            min-height: 100vh;
        }
        h1 {
            color: #e5a00d;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 28px;
            letter-spacing: -0.5px;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status.connected {
            background: rgba(204, 123, 25, 0.15);
            color: #e5a00d;
        }
        .status.disconnected {
            background: rgba(229, 57, 53, 0.15);
            color: #cc3d3d;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            max-width: 1400px;
        }
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background: #282828;
            border-radius: 4px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        .panel h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #3d3d3d;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .event-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .event-list::-webkit-scrollbar {
            width: 6px;
        }
        .event-list::-webkit-scrollbar-track {
            background: #1f1f1f;
        }
        .event-list::-webkit-scrollbar-thumb {
            background: #4d4d4d;
            border-radius: 3px;
        }
        .event-item {
            background: #1f1f1f;
            border-radius: 4px;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-left: 3px solid #e5a00d;
            transition: background 0.2s;
        }
        .event-item:hover {
            background: #252525;
        }
        .event-item .event-type {
            font-weight: 600;
            color: #e5a00d;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.5px;
        }
        .event-item .event-title {
            font-size: 15px;
            margin: 6px 0 4px 0;
            font-weight: 600;
            color: #ffffff;
        }
        .event-item .event-time {
            font-size: 12px;
            color: #808080;
        }
        .json-output {
            background: #1f1f1f;
            border-radius: 4px;
            padding: 16px;
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }
        .json-output::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .json-output::-webkit-scrollbar-track {
            background: #282828;
        }
        .json-output::-webkit-scrollbar-thumb {
            background: #4d4d4d;
            border-radius: 3px;
        }
        .json-output pre {
            margin: 0;
            font-family: 'IBM Plex Mono', 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            line-height: 1.6;
        }
        .json-key { color: #e5a00d; }
        .json-string { color: #7ec699; }
        .json-number { color: #6ab0f3; }
        .json-boolean { color: #cc8866; }
        .json-null { color: #808080; }
        .empty-state {
            color: #808080;
            text-align: center;
            padding: 40px;
            font-size: 14px;
        }
        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 0;
            border-bottom: 1px solid #3d3d3d;
        }
        .tab-button {
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: #808080;
            padding: 14px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s;
            margin-bottom: -1px;
        }
        .tab-button:hover {
            color: #ffffff;
        }
        .tab-button.active {
            color: #e5a00d;
            border-bottom-color: #e5a00d;
        }
        .tab-content {
            display: none;
            padding-top: 24px;
        }
        .tab-content.active {
            display: block;
        }
        .config-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: #1f1f1f;
            border-radius: 4px;
            margin-bottom: 8px;
            transition: background 0.2s;
        }
        .config-item:hover {
            background: #252525;
        }
        .config-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #e5a00d;
            cursor: pointer;
        }
        .config-item label {
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }
        .debug-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }
        .debug-btn {
            background: #e5a00d;
            border: none;
            color: #000000;
            padding: 10px 20px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .debug-btn:hover {
            background: #f0b020;
        }
        .debug-btn:active {
            background: #cc8c00;
        }
        .debug-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .debug-btn.success {
            background: #4caf50;
            color: #ffffff;
        }
        .debug-btn.error {
            background: #cc3d3d;
            color: #ffffff;
        }
        .section-divider {
            border-top: 1px solid #3d3d3d;
            margin: 20px 0;
            padding-top: 16px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin: 12px 0 16px 0;
        }
        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .radio-item input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: #e5a00d;
            cursor: pointer;
        }
        .radio-item label {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
        }
        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #808080;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <h1>Plex Webhooks Dashboard</h1>
    <div id="status" class="status disconnected">
        <span class="status-dot"></span>
        <span id="status-text">Connecting...</span>
    </div>

    <div class="tabs">
        <button class="tab-button active" data-tab="events">Events</button>
        <button class="tab-button" data-tab="config">Administration</button>
    </div>

    <div id="tab-events" class="tab-content active">
        <div class="container">
            <div class="panel">
                <h2>Recent Events</h2>
                <div id="event-list" class="event-list">
                    <div class="empty-state">Waiting for Plex events...</div>
                </div>
            </div>

            <div class="panel">
                <h2>Latest JSON Payload</h2>
                <div id="json-output" class="json-output">
                    <div class="empty-state">No data yet</div>
                </div>
            </div>
        </div>
    </div>

    <div id="tab-config" class="tab-content">
        <div class="panel" style="max-width: 600px;">
            <h2>Debug</h2>

            <div class="section-title">Configuration</div>
            <div class="config-item">
                <input type="checkbox" id="integrate-hue">
                <label for="integrate-hue">
                    <img src="hue-logo.png" alt="Hue" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 8px;">
                    Integrate with Hue?
                </label>
            </div>

            <div class="section-divider">
                <div class="section-title">Trigger Commands</div>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="type-movie" name="media-type" value="movie" checked>
                        <label for="type-movie">Movie</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="type-episode" name="media-type" value="episode">
                        <label for="type-episode">TV Show</label>
                    </div>
                </div>
                <div class="debug-buttons">
                    <button class="debug-btn" data-command="play">Play</button>
                    <button class="debug-btn" data-command="pause">Pause</button>
                    <button class="debug-btn" data-command="resume">Resume</button>
                    <button class="debug-btn" data-command="stop">Stop</button>
                    <button class="debug-btn" data-command="scrobble">Scrobble</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script>
        const eventList = document.getElementById('event-list');
        const jsonOutput = document.getElementById('json-output');
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('status-text');
        let events = [];

        function setConnected(connected) {
            statusEl.className = 'status ' + (connected ? 'connected' : 'disconnected');
            statusText.textContent = connected ? 'Connected' : 'Disconnected';
        }

        function syntaxHighlight(json) {
            const str = JSON.stringify(json, null, 2);
            return str.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
                function (match) {
                    let cls = 'json-number';
                    if (/^"/.test(match)) {
                        if (/:$/.test(match)) {
                            cls = 'json-key';
                            match = match.slice(0, -1) + '</span>:';
                            return '<span class="' + cls + '">' + match;
                        } else {
                            cls = 'json-string';
                        }
                    } else if (/true|false/.test(match)) {
                        cls = 'json-boolean';
                    } else if (/null/.test(match)) {
                        cls = 'json-null';
                    }
                    return '<span class="' + cls + '">' + match + '</span>';
                });
        }

        function getEventIcon(eventType) {
            const icons = {
                'media.play': '▶️',
                'media.pause': '⏸️',
                'media.resume': '▶️',
                'media.stop': '⏹️',
                'media.scrobble': '✅'
            };
            return icons[eventType] || '📺';
        }

        function formatDuration(ms) {
            if (!ms) return '';
            const totalSeconds = Math.floor(ms / 1000);
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            if (hours > 0) {
                return `${hours}h ${minutes}m`;
            }
            return `${minutes}m`;
        }

        function addEvent(data) {
            const command = data.command || {};
            events.unshift({ command, timestamp: data.timestamp });
            if (events.length > 50) events.pop();

            const eventHtml = events.map(e => `
                <div class="event-item">
                    <span class="event-type">${getEventIcon(e.command.event)} ${e.command.event || 'unknown'}</span>
                    <div class="event-title">${e.command.title || 'Unknown Title'}</div>
                    <div class="event-time">
                        ${formatDuration(e.command.duration)}
                        &middot;
                        ${new Date(e.timestamp || Date.now()).toLocaleTimeString()}
                    </div>
                </div>
            `).join('');

            eventList.innerHTML = eventHtml;
        }

        function showToast(data) {
            const command = data.command || {};
            const event = command.event || 'Event';
            const title = command.title || 'Unknown';

            Toastify({
                text: `${getEventIcon(event)} ${event.replace('media.', '').toUpperCase()}: ${title}`,
                duration: 4000,
                gravity: 'top',
                position: 'right',
                style: {
                    background: '#282828',
                    color: '#ffffff',
                    borderLeft: '3px solid #e5a00d',
                    borderRadius: '4px',
                    boxShadow: '0 4px 12px rgba(0,0,0,0.4)',
                    fontFamily: "'Open Sans', sans-serif",
                    fontWeight: '600',
                    fontSize: '13px'
                }
            }).showToast();
        }

        function connect() {
            const eventSource = new EventSource('/api/events');

            eventSource.onopen = function() {
                setConnected(true);
            };

            eventSource.onmessage = function(e) {
                try {
                    const data = JSON.parse(e.data);

                    // Update JSON display with raw Plex payload
                    jsonOutput.innerHTML = '<pre>' + syntaxHighlight(data.payload) + '</pre>';

                    // Add command to event list
                    addEvent(data);

                    // Show toast
                    showToast(data);
                } catch (err) {
                    console.error('Failed to parse event:', err);
                }
            };

            eventSource.onerror = function() {
                setConnected(false);
                eventSource.close();
                // Reconnect after 3 seconds
                setTimeout(connect, 3000);
            };
        }

        connect();

        // Tab switching
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                button.classList.add('active');
                document.getElementById('tab-' + button.dataset.tab).classList.add('active');
            });
        });

        // Config management
        const hueCheckbox = document.getElementById('integrate-hue');

        // Load initial config
        fetch('/api/config')
            .then(res => res.json())
            .then(config => {
                hueCheckbox.checked = config.hueIntegrationEnabled;
            })
            .catch(err => console.error('Failed to load config:', err));

        // Update config on checkbox change
        hueCheckbox.addEventListener('change', () => {
            fetch('/api/config/hue-enabled', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ enabled: hueCheckbox.checked })
            })
            .then(res => res.json())
            .then(config => {
                console.log('Config updated:', config);
            })
            .catch(err => console.error('Failed to update config:', err));
        });

        // Debug command buttons
        document.querySelectorAll('.debug-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const command = btn.dataset.command;
                const type = document.querySelector('input[name="media-type"]:checked').value;
                btn.disabled = true;

                fetch(`/api/debug/${command}?type=${type}`, { method: 'POST' })
                    .then(res => res.json())
                    .then(result => {
                        btn.classList.remove('success', 'error');
                        btn.classList.add(result.success ? 'success' : 'error');
                        setTimeout(() => {
                            btn.classList.remove('success', 'error');
                        }, 1500);
                    })
                    .catch(err => {
                        console.error('Debug command failed:', err);
                        btn.classList.add('error');
                        setTimeout(() => btn.classList.remove('error'), 1500);
                    })
                    .finally(() => {
                        btn.disabled = false;
                    });
            });
        });
    </script>
</body>
</html>
